name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # release.yml waits for a full run of this workflow before it publishes. A
  # called workflow sees the caller's event, a push, which never narrows.
  workflow_call:

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this event has to prove (scripts/change-scope.mjs). Only a pull request
  # is narrowed, and every path it cannot judge means the full run.
  #
  # Each step below it runs unless its check is exactly 'false', so a scope job
  # that fails or loses an output leaves everything running. `required-checks`
  # is what branch protection must require: a skipped job reads as a pass to
  # GitHub, so that job judges the others by what the change owed them.
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      packages: ${{ steps.select.outputs.packages }}
      sandbox: ${{ steps.select.outputs.sandbox }}
      planner: ${{ steps.select.outputs.planner }}
      integration: ${{ steps.select.outputs.integration }}
      desktop: ${{ steps.select.outputs.desktop }}
      engine: ${{ steps.select.outputs.engine }}
      binary: ${{ steps.select.outputs.binary }}
      workspace_args: ${{ steps.select.outputs.workspace_args }}

    steps:
      # Two commits: a pull_request run checks out a merge, and its first
      # parent is the main this change is really being merged into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Work out what this change needs
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs select

  # The suites on Linux, and what only needs proving once: the bubblewrap
  # sandbox, the coverage floors, typecheck, lint and packaging. The windows
  # jobs below run the suites again on Windows.
  #
  # The lockfile records the rollup and esbuild binaries of every platform npm
  # publishes (npm ci demands them all, not only the ones it installs), so
  # `npm ci` builds on linux-x64, linux-arm64, darwin-x64, darwin-arm64 and
  # win32-x64. Keep it that way: a lockfile written beside an existing
  # node_modules has recorded only the host's binaries, so regenerate it with
  # `npm install --package-lock-only` in a copy without node_modules and check
  # that the diff removes nothing.
  build-and-test:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.confirm.outputs.confirmed }}

    # Nothing in CI may reach ordewell.ai (ADR-0048): the integration test
    # starts the real extension, and every step's children inherit this.
    env:
      ORDEWELL_NO_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (core first — cli, web and vscode compile against its dist/)
        id: build-core
        run: npm run build:core

      # The unit tests only prove the arguments bubblewrap is given; these
      # suites start a real one. Ubuntu 24.04 restricts unprivileged user
      # namespaces, so the step applies the fix docs/troubleshooting.md gives
      # users, then ORDEWELL_REQUIRE_SANDBOX makes a probe that still fails a
      # test failure rather than a skip.
      - name: Planner sandbox — real bubblewrap e2e
        id: sandbox
        if: needs.scope.outputs.sandbox != 'false'
        run: bash scripts/linux-sandbox-e2e.sh

      # Skills seeding, slash invocation and the settings migration, each run
      # against the built core in a throwaway HOME.
      - name: Verify scripts (offline, against the built core)
        id: verify-scripts
        run: |
          for f in scripts/verify-*.mjs; do
            node "$f" || exit 1
          done

      # Tests in core that read every tracked file. Docs alone can break them,
      # so they do not wait for core to be selected.
      - name: Repository-wide guards
        id: repo-guards
        run: npm run test:guards

      - name: Planner conversation loop — offline e2e (mock model, no API key)
        id: planner-loop
        if: needs.scope.outputs.planner != 'false'
        run: |
          node bench/live/mock-provider.mjs &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null' EXIT
          # Wait for the mock provider to bind its port rather than a fixed sleep,
          # which raced on loaded runners and orphaned the mock on drive failure.
          for i in $(seq 1 50); do
            if node -e "require('net').connect(3799).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then break; fi
            sleep 0.2
          done
          node bench/live/drive-conversation.mjs

      # The standalone binary (ADR-0065), linux-x64 only: cli-build.yml builds
      # every target on its own runner for a pull request that touches it and
      # for a release. It bundles from the sources and core's dist alone, so
      # it needs no build but core's. The drive starts its own mock on 3799,
      # which the planner loop above has let go, and takes Node off PATH.
      - name: Build the standalone CLI binary
        id: build-binary
        if: needs.scope.outputs.binary != 'false'
        run: node scripts/sea/build.mjs

      - name: CLI binary — offline e2e, no Node on PATH
        id: drive-binary
        if: needs.scope.outputs.binary != 'false'
        run: |
          dist-sea/linux-x64/ordewell --version
          node bench/live/drive-binary.mjs --bin dist-sea/linux-x64/ordewell

      # node:test suites, not vitest: the runner-detection lab makes the real
      # install probe run against shimmed CLIs in a throwaway HOME, and the
      # pipeline test drives plan -> execute -> verify through the fake claude.
      # scripts/**/*.test.mjs run here too: selection's own, the installer's
      # (scripts/install/) and the binary build's (scripts/sea/) among them.
      - name: Bench harness tests (offline, against the built core)
        id: bench
        if: needs.scope.outputs.packages != 'false'
        run: npm run test:bench

      # Desktop last: its renderer is built from ui's dist, and the app forks web's.
      - name: Build (ui, vscode, cli, web & desktop)
        id: build-rest
        if: needs.scope.outputs.packages != 'false'
        run: npm run build -w packages/ui -w packages/vscode -w packages/cli -w packages/web -w packages/desktop --if-present

      # The extension integration test drives a real VS Code instance. Cache the
      # ~320 MB download so only the first run on a new VS Code version pays for
      # it; `test:integration` builds its own bundle (tsup.integration.config.ts).
      #
      # @vscode/test-electron downloads the latest stable satisfying ^1.90.0, so
      # a key built from package.json alone restores the previous build after
      # every VS Code release and still pays the download again. Resolve the list
      # it resolves and key the cache on the version being tested.
      - name: Resolve the VS Code version under test
        id: vscode-version
        if: needs.scope.outputs.integration != 'false'
        run: |
          # The update service can miss a connection; one miss is no verdict.
          for attempt in 1 2 3 4; do
            version=$(node -e "fetch('https://update.code.visualstudio.com/api/releases/stable?released=true').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); }).then((v) => process.stdout.write(String(v[0])))") && break
            echo "The update service did not answer (attempt $attempt of 4)."
            sleep $((attempt * 10))
          done
          [ -n "$version" ] || exit 1
          echo "VS Code under test: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the VS Code download
        if: needs.scope.outputs.integration != 'false'
        uses: actions/cache@v6
        with:
          path: packages/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}

      - name: Install xvfb if the image lacks it
        if: needs.scope.outputs.integration != 'false' || needs.scope.outputs.desktop != 'false'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: VS Code integration test (synthetic runner — no API key)
        id: vscode-integration
        if: needs.scope.outputs.integration != 'false'
        env:
          ORDEWELL_TEST_WORKSPACE: ${{ runner.temp }}/ordewell-integration-workspace
        run: |
          mkdir -p "$ORDEWELL_TEST_WORKSPACE"
          xvfb-run -a npm run test:integration -w ordewell

      # The built Electron app, walked from its welcome window to a merge on the
      # checkout's branch: the planner is bench/live's mock provider and the
      # runner bench/pipeline's fake-claude, so it needs no key and no network.
      - name: Desktop app — offline e2e (mock planner, fake runner)
        id: desktop-e2e
        if: needs.scope.outputs.desktop != 'false'
        run: xvfb-run -a npm run test:desktop-e2e

      - name: Upload the desktop e2e report
        if: ${{ failure() && needs.scope.outputs.desktop != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report
          path: |
            packages/desktop/test-results
            packages/desktop/playwright-report
          if-no-files-found: ignore

      # The same offline run, walked for screenshots and layout checks in both
      # themes at three sizes. TOUR_STRICT makes a failing layout check fail the
      # step, as it does for a local `TOUR_STRICT=1 npm run desktop:tour`.
      - name: Desktop app — visual tour and layout checks
        id: desktop-tour
        if: needs.scope.outputs.desktop != 'false'
        env:
          TOUR_STRICT: '1'
        run: xvfb-run -a npm run desktop:tour

      - name: Upload the desktop tour report
        if: ${{ failure() && needs.scope.outputs.desktop != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tour-report
          path: packages/desktop/test-results/tour
          if-no-files-found: ignore

      - name: Typecheck
        id: typecheck
        if: needs.scope.outputs.packages != 'false'
        run: npm run typecheck

      # Coverage is report-only for the codebase as a whole: no overall
      # threshold, so a percentage never fails the build. The one exception is
      # a per-file floor on the modules the seam refactors introduced (see
      # `thresholds` in packages/core/vitest.config.ts), set at each file's
      # measured value so those seams cannot quietly lose their tests.
      #
      # A selected run names its workspaces; with none named this is the root
      # script, every workspace. WORKSPACE_ARGS is left unquoted to split them.
      - name: Test with coverage
        id: coverage
        if: needs.scope.outputs.packages != 'false'
        shell: bash
        env:
          WORKSPACE_ARGS: ${{ needs.scope.outputs.workspace_args }}
        run: |
          set -o pipefail
          npm run test:coverage $WORKSPACE_ARGS --if-present 2>&1 | tee coverage.log

      - name: Append coverage summaries to the job summary
        if: ${{ always() && needs.scope.outputs.packages != 'false' }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          if (!existsSync('coverage.log')) process.exit(0);
          const log = readFileSync('coverage.log', 'utf8');
          const chunks = log.split(/^> (\S+)@\S+ test:coverage\s*$/m);
          const out = [];
          for (let i = 1; i < chunks.length; i += 2) {
            const name = chunks[i];
            const body = chunks[i + 1] ?? '';
            const marker = body.indexOf('Coverage summary');
            if (marker < 0) continue;
            const rest = body.slice(body.lastIndexOf('\n', marker) + 1);
            const end = rest.search(/\n={20,}/);
            const summary = (end < 0 ? rest : rest.slice(0, end)).trimEnd();
            out.push(`### Coverage — \`${name}\``, '', '```', summary, '```', '');
          }
          process.stdout.write(out.join('\n'));
          NODE

      - name: Upload coverage reports
        if: ${{ always() && needs.scope.outputs.packages != 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: packages/*/coverage/
          if-no-files-found: warn

      - name: Lint
        id: lint
        if: needs.scope.outputs.packages != 'false'
        run: npm run lint

      - name: Package VS Code Extension
        id: package-vscode
        if: needs.scope.outputs.packages != 'false'
        run: npm run package -w packages/vscode

      # The desktop app's Linux installers (AppImage and deb) and its unpacked
      # app, unsigned: proof the packaging config builds on every change. The
      # other two platforms are built by release.yml's desktop job, on a tag.
      - name: Package the desktop app
        id: package-desktop
        if: needs.scope.outputs.packages != 'false'
        run: npm run desktop:package

      # What a user installs: the four npm tarballs, this VSIX and the desktop
      # installers. This fails on a missing entry target, a LICENSE or NOTICE npm
      # left out of `files`, a bundle that cannot start, a third-party notice the
      # VSIX dropped, and a desktop daemon closure left inside app.asar.
      - name: Verify packaged npm and VS Code artifacts
        id: verify-artifacts
        if: needs.scope.outputs.packages != 'false'
        run: node scripts/package-check.mjs

      - name: Upload .vsix
        id: upload-vsix
        if: needs.scope.outputs.packages != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ordewell-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error

      - name: Confirm every step this change owed ran
        id: confirm
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-scope.mjs confirm

  # The container suites on a real Linux engine, with real Claude Code, Codex and
  # OpenCode in the image and a controlled model behind each: no key, no account.
  # `build-and-test` skips them, as its `CI` says to, so this job is what runs
  # them. A test that skips here fails the job (bench/containers/verdict.mjs).
  real-engine:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ORDEWELL_NO_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Real engine — every harness in a real container
        run: npm run test:containers

  # The suites on Windows, which ADR-0010 supports, split four ways: a Windows
  # runner starts processes and runs git several times slower than a Linux one,
  # and the e2e suites do little else. Nothing here is checked that only needs
  # proving once, which build-and-test does.
  windows:
    name: windows (${{ matrix.shard }}/4)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.packages != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      ORDEWELL_NO_VERSION_CHECK: '1'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The cli, web and vscode suites read core through its dist/, and some
      # start the built CLI and daemon.
      - name: Build every package
        run: npm run build

      # The daemon, CLI, core and extension exercise Windows support here.
      # The shared UI and desktop suites run on Linux in build-and-test.
      - name: Test on Windows
        run: npm run test --workspace packages/core --workspace packages/cli --workspace packages/web --workspace packages/vscode --if-present -- --shard=${{ matrix.shard }}/4

  # What runs on Windows beside the suites: the verify scripts, the bench
  # harnesses, the offline planner loop and the VS Code integration test, each
  # as build-and-test runs it on Linux.
  windows-harness:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.packages != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      ORDEWELL_NO_VERSION_CHECK: '1'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build every package
        run: npm run build

      - name: Verify scripts on Windows
        run: |
          for f in scripts/verify-*.mjs; do
            node "$f" || exit 1
          done

      - name: Bench harness tests on Windows
        run: npm run test:bench

      - name: Planner conversation loop on Windows
        if: needs.scope.outputs.planner != 'false'
        run: |
          node bench/live/mock-provider.mjs &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null' EXIT
          for i in $(seq 1 50); do
            if node -e "require('net').connect(3799).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then break; fi
            sleep 0.2
          done
          node bench/live/drive-conversation.mjs

      - name: Resolve the VS Code version under test
        id: vscode-version
        if: needs.scope.outputs.integration != 'false'
        run: |
          # The update service can miss a connection; one miss is no verdict.
          for attempt in 1 2 3 4; do
            version=$(node -e "fetch('https://update.code.visualstudio.com/api/releases/stable?released=true').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); }).then((v) => process.stdout.write(String(v[0])))") && break
            echo "The update service did not answer (attempt $attempt of 4)."
            sleep $((attempt * 10))
          done
          [ -n "$version" ] || exit 1
          echo "VS Code under test: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the VS Code download
        if: needs.scope.outputs.integration != 'false'
        uses: actions/cache@v6
        with:
          path: packages/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}

      # A Windows runner has a desktop, so VS Code needs no virtual display.
      - name: VS Code integration test on Windows
        if: needs.scope.outputs.integration != 'false'
        env:
          ORDEWELL_TEST_WORKSPACE: ${{ runner.temp }}/ordewell-integration-workspace
        run: |
          node -e "require('fs').mkdirSync(process.env.ORDEWELL_TEST_WORKSPACE, { recursive: true })"
          npm run test:integration -w ordewell

  # The status to require on main. `always()`: a job that is itself skipped
  # reports nothing a branch rule can fail on, so this one always concludes.
  required-checks:
    name: Required checks
    if: always()
    needs: [scope, build-and-test, real-engine, windows, windows-harness]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Require every check this change owed
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs gate
