name: Release

on:
  push:
    tags:
      - 'v*'

# A release tag moves the version on every package from local to the registry —
# no cancel-in-progress here: a second push is a different release.

jobs:
  # Coverage floors, the integration test, the artifact checks and the real
  # engine are what main's CI proves, and a tag is not always a commit main
  # proved. Nothing publishes until the tagged commit has passed all of them.
  ci:
    uses: ./.github/workflows/ci.yml

  npm-publish:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package versions
        run: node .github/workflows/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build & test
        run: |
          npm run build
          npm run typecheck
          npm test

      # npm reads the token from .npmrc; setup-node writes it from NODE_AUTH_TOKEN.
      # A package already at this version is skipped, so a release stopped
      # partway can be re-run: npm never takes a version twice.
      - name: Publish npm packages (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          publish() {
            if npm view "$1@$v" version >/dev/null 2>&1; then
              echo "$1@$v is already published; skipping"
            else
              (cd "$2" && npm publish)
            fi
          }
          publish @ordewell/core packages/core
          node .github/workflows/wait-for-npm.mjs @ordewell/core "$v"
          publish @ordewell/web packages/web
          node .github/workflows/wait-for-npm.mjs @ordewell/web "$v"
          publish @ordewell/cli packages/cli
          node .github/workflows/wait-for-npm.mjs @ordewell/cli "$v"
          publish ordewell packages/cli-alias
          node .github/workflows/wait-for-npm.mjs ordewell "$v"

  vscode-publish:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Verify tag matches package versions
        run: node .github/workflows/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package VS Code Extension
        run: npm run package -w packages/vscode

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath packages/vscode/*.vsix --skip-duplicate

      # Same .vsix as the Marketplace, so Open VSX (Cursor, VSCodium, Windsurf) never
      # lags a release. --skip-duplicate here and on the Marketplace keeps a
      # re-pushed tag, or a version already published by hand, from failing the job.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not set; Open VSX would be stranded at the previous version"
            exit 1
          fi
          npx --yes ovsx@1.1.1 publish --packagePath packages/vscode/*.vsix --skip-duplicate

  github-release:
    runs-on: ubuntu-latest
    needs: [npm-publish, vscode-publish]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Idempotent: a re-pushed tag (e.g. after retriggering a stuck run) must not fail this step.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-from-tag
          fi

  # The desktop installers, one runner per OS: an installer is built where it
  # runs (Windows and macOS cannot be cross-built from Linux), and each runner
  # checks the app it just packaged. They are attached to the Release
  # github-release made, so this waits for it. The installers are unsigned
  # (macOS: ad hoc) and auto-update is off until signing exists (ADR-0060).
  desktop:
    needs: github-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Nothing here may reach ordewell.ai (ADR-0048); the daemon smoke starts.
    env:
      ORDEWELL_NO_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Verify tag matches package versions
        run: node .github/workflows/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package the desktop app
        run: npm run desktop:package

      - name: Verify the installers and the unpacked app
        run: node scripts/desktop-package-check.mjs

      # --clobber: a re-run replaces the file it uploaded before. latest*.yml is
      # the feed electron-updater reads once updates are on; blockmaps let it
      # download a difference.
      - name: Attach installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd packages/desktop/release
          # A glob with no match stays literal in bash; only this OS's files exist.
          shopt -s nullglob
          files=(Ordewell-*.dmg Ordewell-*.zip Ordewell-*.exe Ordewell-*.AppImage Ordewell-*.deb Ordewell-*.blockmap latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers in packages/desktop/release"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
